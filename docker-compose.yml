services:
  postgres:
    image: postgres:17-alpine
    container_name: jungle-wallet-postgres
    environment:
      POSTGRES_DB: jungle_wallet
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - jungle_wallet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle -d jungle_wallet"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: jungle-wallet-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./deploy/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  localstack:
    image: localstack/localstack:4
    container_name: jungle-wallet-localstack
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ./deploy/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "awslocal sqs get-queue-url --queue-name wager-transactions.fifo >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    profiles: ["app"]
    build: .
    network_mode: host
    command: ["migrate", "up"]
    environment:
      DATABASE_URL: postgres://jungle:jungle@localhost:5432/jungle_wallet?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  wallet:
    profiles: ["app"]
    build: .
    network_mode: host
    restart: on-failure
    environment:
      DATABASE_URL: postgres://jungle:jungle@localhost:5432/jungle_wallet?sslmode=disable
      OIDC_ISSUER_URL: http://localhost:8081/realms/jungle-wallet
      HTTP_ADDRESS: ":8080"
      INTERNAL_CLIENT_ID: wallet-internal
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
      localstack:
        condition: service_healthy

volumes:
  jungle_wallet_postgres_data:
