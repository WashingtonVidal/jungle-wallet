services:
  postgres:
    image: postgres:17-alpine
    container_name: jungle-wallet-postgres
    environment:
      POSTGRES_DB: jungle_wallet
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle
    ports:
      - "5432:5432"
    volumes:
      - jungle_wallet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle -d jungle_wallet"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: jungle-wallet-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./deploy/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  localstack:
    image: localstack/localstack:4
    container_name: jungle-wallet-localstack
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./deploy/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "awslocal sqs get-queue-url --queue-name wager-transactions.fifo >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  jungle_wallet_postgres_data: